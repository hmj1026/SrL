version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: deployment/docker/php/Dockerfile
    container_name: laravel_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./laravel-app:/var/www/html
    networks:
      - dev
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: dev_web
    restart: always
    volumes:
      - ./deployment/docker/nginx/conf.d:/etc/nginx/conf.d
      - ./deployment/docker/nginx/sslkey:/etc/nginx/sslkey
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app  # Nginx 依賴於 app (PHP-FPM)
    networks:
      dev:
        aliases:
          - docker.nginx

  db:
    image: mariadb:10.6
    container_name: dev_db
    restart: always
    environment:
      MYSQL_DATABASE: srl
      MYSQL_USER: develop
      MYSQL_PASSWORD: developPassword
      MYSQL_ROOT_PASSWORD: rootPassword
    ports:
      - "9001:3306"
    volumes:
      - ./deployment/docker/db:/var/lib/mysql
    networks:
      dev:
        aliases:
          - docker.mariadb

  redis:
    image: redis:6.2
    container_name: dev_redis
    restart: always
    ports:
      - "9002:6379"
    networks:
      dev:
        aliases:
          - docker.redis

networks:
  dev:
    driver: bridge